#Description:
#  本地代价地图需要配置的参数，各参数意义如下:
#  global_frame:在本地代价地图中的全局坐标系;
#  robot_base_frame:机器人本体的基坐标系;
#0.1
local_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0     # 单位是hz
  publish_frequency: 5.0
  static_map: false     # 2025.5.16 被徐改成了true,使用静态地图作为代价地图的标准
  rolling_window: false
  width: 1
  height: 1
  resolution: 0.05  # 局部地图分辨率 单位是 m，一般与静态地图分辨率保持一致, 初始值是0.5
  transform_tolerance: 1.5  # 5.16   10 -> 3 减小了对时间辍延迟的容忍时间
  plugins:
    # - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
