# 5/23日条参

TebLocalPlannerROS:

  # 里程计话题
  odom_topic: odom
  map_frame: map

  # 机器人运动限制（差速驱动）
  acc_lim_x: 0.5
  acc_lim_theta: 3.2
  acc_lim_y: 0.0

  max_vel_x: 0.4
  max_vel_x_backwards: 0.2
  max_vel_theta: 1.5

  min_vel_x: 0.1
  min_vel_theta: 0.2

  min_turning_radius: 0.0
  footprint_model:
    type: "polygon"
    vertices: [[0.17, -0.13], [0.17, 0.13], [-0.17, 0.13], [-0.17, -0.13]]

  # 目标点容差
  # xy_goal_tolerance: 0.15  原始27
  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.1
  free_goal_vel: false

  # 控制优化
  dt_ref: 0.3
  dt_hysteresis: 0.05
  max_samples: 500
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  prefer_forward_driving: true

  # 可行性检查
  feasibility_check_no_poses: 10
  publish_feedback: false

  # 障碍物参数
  min_obstacle_dist: 0.05
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15

  inflation_dist: 0.2
  dynamic_obstacle_inflation_dist: 0.3
  include_dynamic_obstacles: false

  # 优化权重
  weight_optimaltime: 1.0
  weight_obstacle: 50.0
  weight_viapoint: 1.0
  weight_inflation: 0.2
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 1.0
  weight_kinematics_turning_radius: 0.0
  weight_velocity_obstacle_ratio: 1.0

  # 恢复行为
  oscillation_recovery: true
  oscillation_v_eps: 0.05
  oscillation_omega_eps: 0.1

  # 可视化
  visualize_with_time_as_color: false
  enable_homotopy_class_planning: false
  max_global_plan_lookahead_dist: 3.0


