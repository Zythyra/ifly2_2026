save_dir: workspace/workshop_3cls_416

model:
  arch:
    name: GFL

    backbone:
      name: ShuffleNetV2
      model_size: 1.0x
      out_stages: [2, 3, 4]
      activation: LeakyReLU

    fpn:
      name: PAN
      in_channels: [116, 232, 464]
      out_channels: 96
      start_level: 0
      num_outs: 3

    head:
      name: NanoDetHead
      num_classes: 3
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      share_cls_reg: True
      octave_base_scale: 5
      scales_per_octave: 1
      strides: [8, 16, 32]
      reg_max: 7

      norm_cfg:
        type: BN

      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0

class_names: &class_names ["daily_workshop", "food_workshop", "electronics_workshop"]

data:
  train:
    name: xml_dataset
    class_names: *class_names
    img_path: /mnt/d/ucar/shujuji1/image/train
    ann_path: /mnt/d/ucar/shujuji1/annotations/train
    input_size: [416, 416]
    keep_ratio: True
    pipeline:
      perspective: 0.0
      scale: [0.7, 1.3]
      stretch: [[1, 1], [1, 1]]
      rotation: 5
      shear: 0
      translate: 0.1
      flip: 0.0
      brightness: 0.2
      contrast: [0.8, 1.2]
      saturation: [0.8, 1.2]
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

  val:
    name: xml_dataset
    class_names: *class_names
    img_path: /mnt/d/ucar/shujuji1/image/test
    ann_path: /mnt/d/ucar/shujuji1/annotations/test
    input_size: [416, 416]
    keep_ratio: True
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

device:
  gpu_ids: [0]
  workers_per_gpu: 1
  batchsize_per_gpu: 8

schedule:
  optimizer:
    name: SGD
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0001

  warmup:
    name: linear
    steps: 300
    ratio: 0.1

  total_epochs: 120

  lr_schedule:
    name: MultiStepLR
    milestones: [80, 110]
    gamma: 0.1

  val_intervals: 5

evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP

log:
  interval: 10
