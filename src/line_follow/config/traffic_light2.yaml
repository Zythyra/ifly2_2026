# 讯飞2026 YOLOv5红绿灯参数（路线二）

traffic_light2:
  detect_service: /nanodet_detect

  # 模型固定类别：
  # 0 = LEFT
  # 1 = RIGHT
  # 2 = STRAIGHT
  traffic_switch_command: -10
  traffic_detect_command: 10

  # 640输入RKNN单帧推理不需要20Hz，先用8Hz稳定运行
  detect_rate: 8.0

  # 连续几帧方向相同才正式启动巡线
  stable_frames: 3

  service_wait_timeout: 8.0
  camera_warmup: 0.70
  camera_flush_calls: 3

  cmd_vel_topic: /cmd_vel
  direction_topic: /traffic_light/direction

nanodet_detect:
  # 独立红绿灯测试时建议直接traffic启动，
  # 不先加载文字框/OCR，启动更快、NPU占用更低。
  startup_mode: traffic

  traffic_model_path: /home/ucar/ucar_ws_copy/src/ros_nanodet/src/nanodet-0.2.0/workspace/model2026/best_yolov5_640_fp16.rknn

  # 最终置信度=objectness*类别概率；14命令使用低阈值
  traffic_score_threshold: 0.25
  traffic_low_score_threshold: 0.15
  traffic_nms_threshold: 0.45
  traffic_warmup_count: 3

  camera_device: /dev/video0

  # 保持和之前traffic_light.cpp一致的水平镜像
  flip_horizontal: true

  # 需要看框时临时打开：
  enable_debug_image: false
  enable_debug_video: false