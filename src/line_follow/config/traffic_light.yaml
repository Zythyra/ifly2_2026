camera_index: 0                 # 摄像头编号，0 对应 /dev/video0
camera_width: 640               # 图像宽度
camera_height: 480              # 图像高度
mirror_image: true              # true：摄像头画面左右镜像翻转后再显示和识别

cmd_vel_topic: /cmd_vel         # 小车速度控制话题
direction_topic: /traffic_light/direction   # 最终方向结果发布话题

# ============================================================
# 整张图识别
# ============================================================
roi_x: 0.0
roi_y: 0.0
roi_w: 1.0
roi_h: 1.0

# ============================================================
# HSV 绿色阈值
# ============================================================
green_h_min: 35
green_h_max: 95
green_s_min: 120
green_v_min: 120

# ============================================================
# 黑色负形箭头提取
# ============================================================
negative_close_kernel: 17
negative_open_kernel: 3

# ============================================================
# 过曝白芯过滤
# ============================================================
bright_core_v_min: 175
bright_core_s_max: 150
negative_component_min_area: 8

# ============================================================
# 红灯检测
# ============================================================
red_h1_min: 0
red_h1_max: 12
red_h2_min: 168
red_h2_max: 179
red_s_min: 160
red_v_min: 185
red_min_pixels: 80

# ============================================================
# 全图箭头候选过滤
# ============================================================
min_arrow_pixels: 80
max_arrow_pixels: 1800

min_arrow_width: 15
max_arrow_width: 160
min_arrow_height: 15
max_arrow_height: 160

bbox_aspect_min: 0.30
bbox_aspect_max: 3.20

min_arrow_fill_ratio: 0.04
max_arrow_fill_ratio: 0.70

arrow_head_ratio: 1.18
direction_dominance_ratio: 1.12
edge_fraction: 0.40

# ============================================================
# 连续确认帧数
# stable_frames 只在 YAML 里设置，C++ 不再保存默认帧数。
# LEFT / STRAIGHT / RIGHT 三个方向全部共用这个值。
# 省赛当前保持 2 帧；以后需要改，只改这一行。
# ============================================================
stable_frames: 2

show_debug: true

# 路线映射固定在 C++：
# LEFT     -> /line2_left
# STRAIGHT -> /line_right
# RIGHT    -> /line2_right