right_P: 0.015
right_I: 0.05
right_D: 0.04
integration_limit: 150.0

leftpoint_p: 0.004
leftpoint_I: 0.05
leftpoint_D: 0.017

double_P: 0.004
double_I: 0.055
double_D: 0.020

out_turn_angel: -1.3
out_forward: 0.075
out_turn: -1.0
x_max_: 0.85

out_turn: 2.0   # 固定右转角速度的大小
out_forward: 0.4  # 丢线右转时的前进速度
out_turn: 1.8 # 固定右转角速度的大小

# 图像局部自适应二值化参数（由 line.yaml 配置）
adaptive_c: -22           # 局部自适应阈值常数C；当前为-22，数值越负阈值越高，通常越能抑制反光区域被误识别成白色
# 这两个基本不用动
adaptive_block: 45        # 局部自适应阈值的邻域窗口大小；必须是大于1的奇数，如31、45、51；越大越看重较大范围的局部亮度
min_contour_area: 250     # 二值化后保留轮廓的最小面积；小于该面积的白色区域会被当作噪声删除，越大去除小反光/噪点越强

# ============================================================
# 本次新增：检测到停车白线后使用的雷达跟随与停车参数
# 由 line_dependence.launch 加载到 /line_right 命名空间
# ============================================================

# 雷达话题
scan_topic: /scan

# 左侧墙面取点与直线拟合
# LaserScan坐标：0°为车头正前方，正角度为车体左侧
lidar_left_angle_min_deg: 60.0    # 左墙取点扇区起始角，单位°
lidar_left_angle_max_deg: 120.0   # 左墙取点扇区终止角，单位°
lidar_min_valid_range: 0.08       # 左墙拟合最小有效距离，单位m
lidar_max_valid_range: 1.50       # 左墙拟合最大有效距离，单位m
lidar_min_wall_points: 8          # 二次剔除离群点后至少保留的点数
lidar_wall_max_residual: 0.03     # 点到初次拟合直线的最大残差，单位m

# 左墙平行、等距控制
lidar_left_target_distance: 0.25  # 雷达到左墙的目标垂直距离，单位m
lidar_heading_kp: 1.8             # 墙面方向误差增益
lidar_distance_kp: 2.0            # 左墙距离误差增益
lidar_max_angular_speed: 0.8      # 雷达阶段最大角速度，单位rad/s
lidar_filter_alpha: 0.35          # 拟合结果低通系数，越大响应越快

# 前方停车与雷达失效保护
lidar_front_half_angle_deg: 15.0  # 前方停车检测扇区为±15°
lidar_front_stop_distance: 0.30   # 前方最近点不大于该距离时停车，单位m
lidar_scan_timeout: 0.30          # 等待一帧雷达数据的最长时间，单位s
lidar_max_invalid_scans: 3        # 连续无效帧达到该值时结束雷达控制

start_straight_distance: 0.14 # 从起始停止线向前行驶的距离，单位 m
start_turn_angular_speed: 1.3 # 进入右半圆前的转弯角速度大小，保持正数
start_rotate_angle_deg: 60.0       # 原地右转的角度，单位 °
start_straight_speed: 0.5

