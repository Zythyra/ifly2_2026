# line_left V15 配套参数（与 line_right V14 同一结构）
# 唯一校验标识：LINE_LEFT_V15_GOAL_4P75_0P20_TRIGGER_Y_LT_0P75
# 触发：当前 y < 0.75，且距终点 (4.75, 0.20) < 0.75m；最终方向 0°。

# ==================== 左线巡线参数 ====================
# 为兼容现有代码与参数文件，PID键名继续使用 right_P/right_I/right_D。
center_distance: 240

right_P: 0.015
right_I: 0.05
right_D: 0.04
integration_limit: 150.0

leftpoint_p: 0.004
leftpoint_I: 0.05
leftpoint_D: 0.017

double_P: 0.004
double_I: 0.055
double_D: 0.020

out_turn_angel: -1.3
x_max_: 0.8

# 左线丢失后的镜像漂移：前进 + 向右横移 + 左转。
out_forward: 0.35
out_turn: 1.3
out_right_speed: 0.08

# ==================== 图像二值化 ====================
adaptive_c: -25
adaptive_block: 45
min_contour_area: 250

calibration_file: /home/ucar/ucar_ws_copy/src/line_follow/camera_info/pinhole.yaml

# ==================== 启动视觉屏蔽与定向直行 ====================
# 启动设置与 line_right 完全一致。
start_straight_speed: 0.50
start_straight_distance: 0.14
start_heading_yaw_deg: -90.0
start_heading_kp: 2.5
start_heading_max_angular_speed: 0.60
start_heading_deadband_deg: 0.5
start_heading_pause_error_deg: 6.0
start_control_rate: 30.0
start_line_confirm_frames: 3

# ==================== AMCL 初始位姿 ====================
# 每次 line_left 服务开始巡线前，向 /initialpose 连续发布该位姿。
# 数值与 line_right 完全一致。
map_frame: map
base_frame: base_link

initial_pose_x: 2.50
initial_pose_y: 2.60
initial_pose_yaw_deg: -90.0
initial_pose_covariance_xy: 0.01
initial_pose_covariance_yaw: 0.01
initial_pose_publish_count: 3
initial_pose_publish_interval: 0.10

# ==================== AMCL 停靠触发条件 ====================
# 两项必须同时满足，随后视觉巡线无停顿切换为纯PP位姿停靠：
# 1. 当前 AMCL y < docking_trigger_max_y
# 2. 当前点到 (4.75, 0.20) 的距离 < docking_trigger_distance
docking_trigger_max_y: 0.75
docking_trigger_distance: 0.75

# 固定停靠终点与最终朝向
docking_goal_x: 4.75
docking_goal_y: 0.25
docking_goal_yaw_deg: 0.0

# ==================== 纯 PP 位姿停靠 ====================
docking_control_rate: 30.0

# 到点判定容差；角度单位为 rad
docking_position_tolerance: 0.025
docking_yaw_tolerance: 0.05

# 地图系误差转换到 base_link 后的 vx、vy、wz 增益
docking_linear_x_gain: 2.50
docking_linear_y_gain: 1.20
docking_angular_gain: 1.50

# 克服底盘死区的最小非零速度
docking_min_linear_speed: 0.10
docking_min_angular_speed: 0.010

# 停靠阶段速度上限
docking_max_vel_x: 0.90
docking_max_vel_y: 0.40
docking_max_vel_theta: 0.90

# 从巡线末帧平滑衔接到停靠速度，不插入零速帧
docking_acc_lim_x: 2.00
docking_acc_lim_y: 2.00
docking_acc_lim_theta: 8.00

# ==================== 丢线判定与漂移恢复状态机 ====================
# 第n次失败时：
# vx = x_max_ - n * (x_max_ - out_forward) / lost_confirm_frames
# 第 lost_confirm_frames 次失败时，vx 恰好降至 out_forward 并进入锁存漂移。
lost_confirm_frames: 4

# 疑似丢线后，必须连续识别到这么多帧左线才取消怀疑。
lost_cancel_confirm_frames: 2

# 进入漂移后，必须连续识别到这么多帧左线才完全恢复PID。
drift_recover_confirm_frames: 2

# 疑似丢线阶段只逐帧降低vx，默认不横移、不转向。
lost_confirm_linear_y: 0.0
lost_confirm_angular_z: 0.0
